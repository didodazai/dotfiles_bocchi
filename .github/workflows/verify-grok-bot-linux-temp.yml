name: Verify Grok Bot Linux AppImage (temporary)

on:
  push:
    branches: [osaragi]
    paths:
      - .github/workflows/verify-grok-bot-linux-temp.yml

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read official Linux stable feed and hash AppImage
        shell: bash
        run: |
          set -euo pipefail
          FEED='https://api2.cursor.sh/updates/api/download/stable/linux-x64/sand'
          curl --fail --location --silent --show-error --retry 2 --max-time 45 "$FEED" --output /tmp/release.json
          echo 'Official Linux release metadata:'
          jq '{version, commitSha, downloadUrl}' /tmp/release.json
          VERSION="$(jq -r '.version // empty' /tmp/release.json)"
          COMMIT="$(jq -r '.commitSha // empty' /tmp/release.json)"
          URL="$(jq -r '.downloadUrl // empty' /tmp/release.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'No valid Linux version returned'; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'No valid Linux commit returned'; exit 1; }
          [[ "$URL" == "https://downloads.cursor.com/grokbot/stable/$COMMIT/linux/x64/"*".AppImage" ]] || { echo 'Unexpected installer URL'; exit 1; }
          echo "GROK_VERSION=$VERSION"
          echo "GROK_COMMIT=$COMMIT"
          echo "GROK_APPIMAGE_URL=$URL"
          curl --fail --location --silent --show-error --retry 2 --max-time 540 "$URL" --output /tmp/Grok_Bot.AppImage
          test -s /tmp/Grok_Bot.AppImage
          echo "GROK_APPIMAGE_SHA256_HEX=$(sha256sum /tmp/Grok_Bot.AppImage | cut -d' ' -f1)"
          python3 - <<'PY'
          import hashlib, base64
          with open('/tmp/Grok_Bot.AppImage','rb') as f:
              digest = hashlib.file_digest(f,'sha256').digest()
          print('GROK_APPIMAGE_SHA256_SRI=sha256-'+base64.b64encode(digest).decode())
          PY
