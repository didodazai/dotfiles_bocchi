name: Verify Grok Bot 0.75.8 AppImage checksum (temporary)

on:
  push:
    branches: [osaragi]
    paths:
      - .github/workflows/verify-grok-bot-0758-temp.yml

permissions: {}

jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate official Linux x64 stable release and checksum
        shell: bash
        run: |
          set -euo pipefail
          URL='https://downloads.cursor.com/grokbot/stable/039d88c52f45f8af72fbe7379bc426c171edf62b/linux/x64/Grok_Bot_0.75.8.AppImage'
          curl -fLsS --retry 2 --max-time 40 'https://api2.cursor.sh/updates/api/download/stable/linux-x64/sand' -o /tmp/release.json
          jq '{version, commitSha, downloadUrl}' /tmp/release.json
          CURRENT_VERSION="$(jq -r '.version // empty' /tmp/release.json)"
          echo "CURRENT_GROK_BOT_STABLE=$CURRENT_VERSION"
          [ -n "$CURRENT_VERSION" ]
          # The installer URL is independently grounded in the official download page.
          curl --fail --location --silent --show-error --retry 2 --max-time 500 "$URL" --output /tmp/Grok_Bot_0.75.8.AppImage
          test -s /tmp/Grok_Bot_0.75.8.AppImage
          echo "GROK_BOT_0758_SOURCE=$URL"
          echo "GROK_BOT_0758_SHA256=$(sha256sum /tmp/Grok_Bot_0.75.8.AppImage | cut -d' ' -f1)"
